<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabFood OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- QRCode.js (offline capable via CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="main-header">
    <div id="logo-area" onclick="app.secretLogin()">
      <div class="logo-mark" id="secret-ring">
        <img id="logo-img" src="" alt="" style="display:none">
        <span id="logo-emoji">🍽️</span>
      </div>
      <div class="logo-text-wrap">
        <span class="logo-name" id="logo-name">LabFood</span>
        <span class="logo-os">OS</span>
      </div>
      <span id="secret-dot" class="secret-dot"></span>
    </div>
    <div id="header-actions"></div>
  </header>

  <main id="viewport"></main>

  <div id="cartFab" style="display:none" onclick="totem.toggleCart()">
    <span>🛒</span>
    <div id="cartCount">0</div>
  </div>

  <div id="toast"></div>
  <div id="modal-root"></div>

  <script src="js/state.js"></script>
  <script src="js/app.js"></script>
  <script src="js/totem.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/caixa.js"></script>
  <script src="js/qr.js"></script>
</body>
</html>
